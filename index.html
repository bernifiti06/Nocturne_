<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1F">
<meta name="description" content="Nocturne: desconnecta abans de dormir amb respiració guiada, sons, un acompanyant d'IA i un diari del son.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nocturne">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Nocturne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <span class="logo">Nocturne</span>
    <button class="icon-btn" id="open-settings" data-i18n-aria="settings" aria-label="Configuració">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
    </button>
  </header>

  <main>

    <!-- AVUI -->
    <section class="screen active" id="screen-avui">
      <p class="eyebrow" id="today-date"></p>
      <h1 class="display" id="greet">Bona nit.</h1>
      <p class="lede" data-i18n="lede"></p>

      <div class="hero" id="home-last"></div>

      <div class="tiles">
        <button class="tile t-respira" data-go="respira"><span class="ti">🌬️</span><span data-i18n="navRespira"></span></button>
        <button class="tile t-sons" data-go="sons"><span class="ti">🎧</span><span data-i18n="navSons"></span></button>
        <button class="tile t-parla" data-go="parla"><span class="ti">💬</span><span data-i18n="navParla"></span></button>
        <button class="tile t-diari" data-go="diari"><span class="ti">📓</span><span data-i18n="navDiari"></span></button>
      </div>

      <div class="card" id="home-week"></div>
      <div class="card tip" id="home-tip"></div>
    </section>

    <!-- RESPIRA -->
    <section class="screen" id="screen-respira">
      <p class="eyebrow" data-i18n="eyBreathe"></p>
      <h1 class="display" data-i18n="hBreathe"></h1>
      <p class="lede" data-i18n="ledeBreathe"></p>

      <div class="segmented" id="pattern-seg">
        <button class="on" data-pat="box" data-i18n="patBox"></button>
        <button data-pat="478" data-i18n="pat478"></button>
        <button data-pat="coh" data-i18n="patCoh"></button>
      </div>

      <div class="breath">
        <div class="rings" id="rings"><i></i><i></i><i></i></div>
        <div class="breath-text">
          <div class="breath-phase" id="b-phase"></div>
          <div class="breath-count" id="b-count">&nbsp;</div>
        </div>
      </div>
      <p class="meta center" id="b-cycles"></p>
      <button class="btn" id="b-toggle"></button>
    </section>

    <!-- SONS -->
    <section class="screen" id="screen-sons">
      <p class="eyebrow" data-i18n="eySounds"></p>
      <h1 class="display" data-i18n="hSounds"></h1>
      <p class="lede" data-i18n="ledeSounds"></p>
      <div class="card list" id="tracks"></div>
      <div class="card">
        <label class="field" for="sleep-timer" data-i18n="timer"></label>
        <select id="sleep-timer"></select>
        <p class="meta small" id="timer-note"></p>
      </div>
    </section>

    <!-- PARLA -->
    <section class="screen" id="screen-parla">
      <p class="eyebrow" data-i18n="eyTalk"></p>
      <h1 class="display" data-i18n="hTalk"></h1>

      <div class="segmented" id="parla-seg">
        <button class="on" data-sub="chat" data-i18n="segChat"></button>
        <button data-sub="rutina" data-i18n="segRoutine"></button>
      </div>

      <div id="sub-chat">
        <div class="card chat">
          <div class="chat-box" id="chat-box"></div>
          <div class="chat-row">
            <input type="text" id="chat-input" data-i18n-ph="chatPh" autocomplete="off">
            <button class="send" id="chat-send" aria-label="Enviar">
              <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="sub-rutina" hidden>
        <div class="card">
          <label class="field" data-i18n="rHabits"></label>
          <textarea id="r-habits" rows="3" data-i18n-ph="rHabitsPh"></textarea>
          <div class="two">
            <div>
              <label class="field" data-i18n="rDinner"></label>
              <input type="time" id="r-sopar">
            </div>
            <div>
              <label class="field" data-i18n="rSleep"></label>
              <input type="time" id="r-dormir">
            </div>
          </div>
          <button class="btn" id="r-go"></button>
        </div>
        <div id="r-out"></div>
      </div>
    </section>

    <!-- DIARI -->
    <section class="screen" id="screen-diari">
      <p class="eyebrow" data-i18n="eyJournal"></p>
      <h1 class="display" data-i18n="hJournal"></h1>
      <p class="lede" data-i18n="ledeJournal"></p>

      <div class="card">
        <div class="card-head"><span data-i18n="thisWeek"></span><span class="meta" id="week-avg"></span></div>
        <div class="chart" id="chart"></div>
        <p class="meta small" id="goal-note"></p>
      </div>

      <div class="card">
        <div class="card-head"><span data-i18n="logNight"></span></div>
        <label class="field" data-i18n="wakeDay"></label>
        <input type="date" id="d-date">
        <div class="two">
          <div>
            <label class="field" data-i18n="bedAt"></label>
            <input type="time" id="d-bed" value="23:00">
          </div>
          <div>
            <label class="field" data-i18n="wakeAt"></label>
            <input type="time" id="d-wake" value="07:00">
          </div>
        </div>
        <label class="field" data-i18n="rest"></label>
        <div class="quality" id="d-quality">
          <button data-q="1" aria-label="1">😞</button><button data-q="2" aria-label="2">🙁</button><button data-q="3" class="on" aria-label="3">😐</button><button data-q="4" aria-label="4">🙂</button><button data-q="5" aria-label="5">😄</button>
        </div>
        <p class="meta small" id="q-label"></p>
        <label class="field" data-i18n="screensLabel"></label>
        <select id="d-screens"></select>
        <label class="field" data-i18n="noteLabel"></label>
        <input type="text" id="d-note" maxlength="120" data-i18n-ph="notePh">
        <button class="btn" id="d-save" data-i18n="saveNight"></button>
      </div>

      <div class="card">
        <div class="card-head"><span data-i18n="history"></span></div>
        <div id="d-list"></div>
      </div>
    </section>

  </main>

  <nav class="dock" aria-label="Navegació">
    <button class="active" data-tab="avui">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      <span data-i18n="navAvui"></span>
    </button>
    <button data-tab="respira">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/></svg>
      <span data-i18n="navRespira"></span>
    </button>
    <button data-tab="sons">
      <svg viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 12h-2"/></svg>
      <span data-i18n="navSons"></span>
    </button>
    <button data-tab="parla">
      <svg viewBox="0 0 24 24"><path d="M5 6h14a1 1 0 011 1v8a1 1 0 01-1 1h-7l-4 3v-3H5a1 1 0 01-1-1V7a1 1 0 011-1z"/></svg>
      <span data-i18n="navParla"></span>
    </button>
    <button data-tab="diari">
      <svg viewBox="0 0 24 24"><path d="M6 4h11a1 1 0 011 1v14a1 1 0 01-1 1H6zM6 4v16M10 9h5M10 13h4"/></svg>
      <span data-i18n="navDiari"></span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <dialog id="settings">
    <h2 class="display sm" data-i18n="stTitle"></h2>

    <h3 data-i18n="stLang"></h3>
    <div class="segmented tight" id="set-lang">
      <button data-lang="ca">Català</button>
      <button data-lang="es">Castellano</button>
      <button data-lang="en">English</button>
    </div>

    <h3 data-i18n="stLook"></h3>
    <div class="segmented tight" id="set-theme">
      <button data-theme="dark" data-i18n="dark"></button>
      <button data-theme="light" data-i18n="light"></button>
    </div>

    <h3 data-i18n="stGoal"></h3>
    <div class="stepper">
      <button id="goal-minus" aria-label="−">−</button>
      <span id="goal-val"></span>
      <button id="goal-plus" aria-label="+">+</button>
    </div>

    <h3 data-i18n="stData"></h3>
    <button class="btn ghost small" id="export-csv" data-i18n="export"></button>
    <button class="btn ghost small danger" id="erase-diary" data-i18n="erase"></button>

    <h3 data-i18n="stInstall"></h3>
    <p class="meta" data-i18n="install"></p>

    <p class="meta about" data-i18n="about"></p>
    <button class="btn" id="close-settings" data-i18n="close"></button>
  </dialog>

</div>
<script src="app.js"></script>
</body>
</html>
